name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 打包前先验一遍基础功能，避免"包打出来了但根本跑不起来"
      - name: Self check
        run: npm run selfcheck

      # 打 tag 时 electron-builder 默认会自己去发 Release（需要 GH_TOKEN，会直接失败）。
      # 这里用 --publish never 关掉它，发布统一交给下面的 Release 步骤。
      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 没有签名证书，跳过签名
        run: npm run dist -- --publish never

      # 手动触发（非 tag）时只存构建产物，供下载检查
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: release/*.exe
          retention-days: 7

      # 推 tag 时把安装包挂到 Release
      - name: Attach installers to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
