name: ci

# 每次推分支 / 提 PR 都过一遍语法和自检。
# 构建安装包仍然只在推 v* 标签时由 build-release.yml 负责。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax + self check
        run: npm run check
