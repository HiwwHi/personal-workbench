name: Bug 反馈
description: 有功能没按预期工作
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先把「系统设置 → 维护与迁移 → 系统信息」里的**版本号**抄下来，这个能省很多来回。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 系统设置 → 维护与迁移 → 系统信息 → 版本
      placeholder: v1.0.1
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - 安装版（Setup exe）
        - 免安装版（portable exe）
        - 源码：npm start（Electron）
        - 源码：start-workbench.vbs（托盘 + 浏览器）
        - 源码：npm run server（浏览器）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开工作台开始，一步一行
      placeholder: |
        1. 打开「系统设置」
        2. 点「生成并交给 Cursor」
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
      placeholder: 期望…，实际…
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息（可选）
      description: 界面上的提示、或者启动日志里的最后几行。**请去掉其中的个人路径**
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私自查
      options:
        - label: 我已确认截图和日志里没有真实密码、真实项目名或本机用户名
          required: true
